info:
  name: New Access Token "user"
  type: http
  seq: 2

http:
  method: POST
  url: "{{oidcTokenUrl}}"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}"
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{clientSecret}}"

runtime:
  variables:
    - name: username
      value: user
    - name: password
      value: p
    - name: clientId
      value: go-client
    - name: clientSecret
      value: jR8C0CG4bBHox9S16GmWSG9TFRMiy6fa
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.access_token
      operator: matches
      value: .+\..+\..+

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
