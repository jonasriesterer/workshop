<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autohaus API</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --surface2:#21253a;
      --border:  #2e3244;
      --accent:  #6c8eff;
      --accent2: #3ecf8e;
      --danger:  #ff6b6b;
      --text:    #e2e8f0;
      --muted:   #8892a4;
      --radius:  8px;
      --font:    'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 2rem; color: var(--accent); }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    .layout { display: grid; grid-template-columns: 1fr; gap: 1.5rem; max-width: 560px; margin: 0 auto; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .3rem; margin-top: .9rem; }
    label:first-of-type { margin-top: 0; }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: .9rem;
      padding: .5rem .75rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }

    .section-title {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--accent);
      border-top: 1px solid var(--border);
      padding-top: .9rem;
      margin-top: 1.2rem;
      margin-bottom: .2rem;
    }

    button {
      margin-top: 1.2rem;
      width: 100%;
      padding: .6rem 1rem;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    button.primary { background: var(--accent);  color: #fff; }
    button.success { background: var(--accent2); color: #0f1117; }

    /* ── Response area ── */
    .result { margin-top: 1.2rem; display: none; }
    .result.visible { display: block; }

    .status-badge {
      display: inline-block;
      padding: .15rem .6rem;
      border-radius: 99px;
      font-size: .75rem;
      font-weight: 700;
      margin-bottom: .9rem;
    }
    .ok  { background: #1a3a2a; color: var(--accent2); }
    .err { background: #3a1a1a; color: var(--danger); }

    .err-msg { font-size: .85rem; color: var(--danger); }

    /* ── Autohaus detail card ── */
    .ah-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

    .ah-header {
      background: var(--surface2);
      padding: .9rem 1rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      border-bottom: 1px solid var(--border);
    }
    .ah-header .ah-name { font-weight: 700; font-size: 1rem; }
    .ah-header .ah-id   { font-size: .75rem; color: var(--muted); margin-left: auto; }

    .props { padding: .5rem 0; }

    .prop {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      padding: .45rem 1rem;
    }
    .prop:hover { background: var(--surface2); }
    .prop .icon { font-size: 1rem; width: 1.4rem; text-align: center; flex-shrink: 0; margin-top: .05rem; }
    .prop .key  { font-size: .75rem; color: var(--muted); width: 7rem; flex-shrink: 0; padding-top: .15rem; }
    .prop .val  { font-size: .85rem; color: var(--text); word-break: break-all; }
    .prop .val a { color: var(--accent); text-decoration: none; }
    .prop .val a:hover { text-decoration: underline; }

    .sub-title {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      padding: .5rem 1rem .25rem;
      border-top: 1px solid var(--border);
      margin-top: .25rem;
    }

    .sub-section {
      border-top: 1px solid var(--border);
      margin-top: .25rem;
    }
    .sub-section-header {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem 1rem .3rem;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
    }
    .sub-props { padding-bottom: .25rem; }
    .sub-prop {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .35rem 1rem .35rem 2.5rem;
      font-size: .84rem;
    }
    .sub-prop:hover { background: var(--surface2); }
    .sub-prop .key { color: var(--muted); width: 6rem; flex-shrink: 0; }
    .sub-prop .val { color: var(--text); word-break: break-all; }

    .auto-entry {
      border-top: 1px solid var(--border);
      padding: .5rem 1rem .5rem 2.5rem;
    }
    .auto-entry:last-child { padding-bottom: .75rem; }
    .auto-plate {
      display: inline-block;
      background: #fff;
      color: #111;
      font-weight: 700;
      font-size: .75rem;
      padding: .1rem .45rem;
      border-radius: 3px;
      letter-spacing: .03em;
      margin-bottom: .35rem;
    }
    .auto-props { display: flex; flex-wrap: wrap; gap: .4rem .9rem; }
    .auto-prop { font-size: .82rem; color: var(--muted); }
    .auto-prop span { color: var(--text); }

    pre.err-pre {
      font-size: .8rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--danger);
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }
  </style>
</head>
<body>

<div style="max-width:1100px; margin:0 auto 1.5rem;">
  <h1>Autohäuser</h1>
</div>

<div class="layout">

  <!-- GET by ID -->
  <div class="card">
    <h2>Welches Autohaus suchst du? (101 - 107)</h2>

    <label for="get-id">ID</label>
    <input id="get-id" type="number" min="1" placeholder="1" />

    <button class="primary" onclick="getById()">Abrufen</button>

    <div id="get-result" class="result">
      <span id="get-status" class="status-badge"></span>
      <div id="get-body"></div>
    </div>
  </div>


</div>

<script>
  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return Number.isNaN(d) ? iso : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function fmtDateTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return Number.isNaN(d) ? iso : d.toLocaleString('de-DE');
  }

  function prop(icon, key, val) {
    return `<div class="prop">
      <span class="icon">${icon}</span>
      <span class="key">${key}</span>
      <span class="val">${val || '—'}</span>
    </div>`;
  }

  function subProp(key, val) {
    return `<div class="sub-prop"><span class="key">${key}</span><span class="val">${val || '—'}</span></div>`;
  }

  function renderAutohaus(ah) {
    const homepage = ah.homepage
      ? `<a href="${ah.homepage}" target="_blank">${ah.homepage}</a>`
      : '—';

    const adresseSection = `
      <div class="sub-section">
        <div class="sub-section-header"><span>📍</span> Adresse</div>
        <div class="sub-props">
          ${subProp('PLZ',  ah.adresse.plz)}
          ${subProp('Ort',  ah.adresse.ort)}
          ${subProp('Land', ah.adresse.land)}
        </div>
      </div>`;

    const autosSection = (() => {
      const list = ah.autos || [];
      const entries = list.length
        ? list.map(a => `
            <div class="auto-entry">
              <div class="auto-plate">${a.kennzeichen}</div>
              <div class="auto-props">
                <span class="auto-prop">Marke <span>${a.marke}</span></span>
                <span class="auto-prop">Modell <span>${a.modell}</span></span>
                <span class="auto-prop">Baujahr <span>${a.baujahr}</span></span>
              </div>
            </div>`).join('')
        : '<div style="padding:.4rem 1rem .6rem 2.5rem;font-size:.82rem;color:var(--muted)">Keine Fahrzeuge</div>';
      return `
        <div class="sub-section">
          <div class="sub-section-header"><span>🚗</span> Fahrzeuge</div>
          ${entries}
        </div>`;
    })();

    return `<div class="ah-card">
      <div class="ah-header">
        <span>🏢</span>
        <span class="ah-name">${ah.name}</span>
        <span class="ah-id">ID ${ah.id}</span>
      </div>
      <div class="props">
        ${prop('👤', 'Username',  ah.username)}
        ${prop('✉️',  'E-Mail',    ah.email)}
        ${prop('📞', 'Telefon',   ah.telefonnr || '—')}
        ${prop('🌐', 'Homepage',  homepage)}
        ${prop('📅', 'Gründung',  fmtDate(ah.gruendungsdatum))}
        ${prop('🔢', 'Fahrzeuge', ah.anzahlFahrzeuge)}
        ${prop('🔄', 'Version',   ah.version)}
        ${prop('🕐', 'Erstellt',  fmtDateTime(ah.erzeugt))}
        ${prop('🔁', 'Geändert',  fmtDateTime(ah.aktualisiert))}
      </div>
      ${adresseSection}
      ${autosSection}
    </div>`;
  }

  function showBadge(id, status) {
    const badge = document.getElementById(id);
    const ok = status >= 200 && status < 300;
    badge.className = 'status-badge ' + (ok ? 'ok' : 'err');
    badge.textContent = status;
  }

  async function getById() {
    const id = document.getElementById('get-id').value;
    if (!id) return;

    const res  = await fetch(`/rest/${id}`);
    const text = await res.text();
    const result = document.getElementById('get-result');
    const body   = document.getElementById('get-body');

    result.classList.add('visible');
    showBadge('get-status', res.status);

    if (res.ok) {
      body.innerHTML = renderAutohaus(JSON.parse(text));
    } else {
      body.innerHTML = `<pre class="err-pre">${text}</pre>`;
    }
  }

</script>

</body>
</html>
