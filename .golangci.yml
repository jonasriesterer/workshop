version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/myorg/myservice

issues:
  exclude-rules:
    - path: internal/db/
      linters:
        - revive
        - errcheck
